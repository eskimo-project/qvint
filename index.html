<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>QViNT Pixel Beat</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080816;color:#fff;font-family:Arial,sans-serif}body{display:grid;place-items:center;padding:16px}.g{width:min(100%,720px);position:relative;border:2px solid #ff4cb8;border-radius:18px;overflow:hidden;background:#09091d;box-shadow:0 0 32px #ff4cb855}.p{display:block;width:100%;height:auto;filter:saturate(1.05) brightness(.92);image-rendering:auto}.s{position:absolute;inset:0;background:linear-gradient(#05051222,#05051266 58%,#050512aa);pointer-events:none}.hud{position:absolute;left:14px;right:14px;top:14px;display:flex;justify-content:space-between;z-index:3;font-weight:900}.pill{background:#080816cc;border:1px solid #ff7bd0;padding:8px 12px;border-radius:999px}.ov{position:absolute;inset:0;display:grid;place-items:center;z-index:5;background:#070718b3;padding:28px;text-align:center}.panel{width:min(92%,430px);background:#0c0c22ee;border:2px solid #ff4cb8;padding:24px;border-radius:18px}h1{margin:0 0 8px;font-size:clamp(28px,8vw,52px)}.sub{opacity:.82;line-height:1.5;margin-bottom:18px}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}button,.enter{border:0;background:linear-gradient(135deg,#ff2ea6,#8a5cff);color:#fff;font-weight:900;padding:14px 22px;border-radius:999px;font-size:16px;cursor:pointer;text-decoration:none}.enter{background:#fff;color:#d80074}.n{position:absolute;z-index:4;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:29px;background:#ff42bddd;border:2px solid #fff;box-shadow:0 0 22px #ff42bd;user-select:none;touch-action:manipulation}.n.a{background:#6f5dffdd;box-shadow:0 0 22px #6f5dff}.hit{transform:scale(1.8);opacity:0;transition:.18s}.b{position:absolute;left:0;right:0;bottom:0;padding:14px;text-align:center;z-index:3;font-weight:800;background:linear-gradient(transparent,#09091dcc)}@media(max-width:520px){body{padding:0}.g{border-radius:0;border-left:0;border-right:0}}</style></head><body><div class="g" id="g"><img class="p" src="qvint-pixel-game.png" alt="QViNT pixel poster"><div class="s"></div><div class="hud"><div class="pill">SCORE <span id="sc">0</span></div><div class="pill">TIME <span id="tm">20</span></div></div><div class="b">Tap the ✦ beats before they disappear!</div><div class="ov" id="ov"><div class="panel"><h1>QViNT PIXEL BEAT</h1><div class="sub">Fin • Amp • Freshy • Hongying<br>Hit as many beats as you can in 20 seconds.</div><button id="go">▶ PLAY</button></div></div></div><script>const g=document.getElementById('g'),sc=document.getElementById('sc'),tm=document.getElementById('tm'),ov=document.getElementById('ov');let s=0,t=20,a,b,p=0;function sp(){if(!p)return;let n=document.createElement('div');n.className='n'+(Math.random()>.5?' a':'');n.textContent=Math.random()>.5?'✦':'♥';let r=g.getBoundingClientRect(),z=54;n.style.left=(Math.random()*(r.width-z-24)+12)+'px';n.style.top=(Math.random()*(r.height-z-150)+80)+'px';let d=0;n.onpointerdown=()=>{if(d||!p)return;d=1;sc.textContent=++s;n.classList.add('hit');setTimeout(()=>n.remove(),180)};g.appendChild(n);setTimeout(()=>{if(!d)n.remove()},900+Math.random()*650)}function end(){p=0;clearInterval(a);clearInterval(b);document.querySelectorAll('.n').forEach(x=>x.remove());ov.style.display='grid';ov.innerHTML='<div class="panel"><h1>TIME UP!</h1><div class="sub">Your score: <b>'+s+'</b><br>'+(s>=18?'QViNT LEVEL: LEGEND 💖':s>=10?'QViNT LEVEL: STAR ✨':'Try one more round! 🎮')+'</div><div class="actions"><button id="again">↻ PLAY AGAIN</button><a class="enter" href="home.html">ENTER QViNT WEBSITE →</a></div></div>';document.getElementById('again').onclick=start}function start(){s=0;t=20;p=1;sc.textContent=0;tm.textContent=20;ov.style.display='none';clearInterval(a);clearInterval(b);sp();a=setInterval(sp,420);b=setInterval(()=>{tm.textContent=--t;if(t<=0)end()},1000)}document.getElementById('go').onclick=start;</script></body></html>
